<!DOCTYPE html>
<html>
<head>
  <title>Admin Dashboard - Adoption Requests</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    #requests {
      width: 100%;
      border-collapse: collapse;
      margin-top: 20px;
    }

    #requests th,
    #requests td {
      padding: 12px;
      text-align: left;
      border: 1px solid #ccc;
    }

    #requests th {
      background-color: #f4f4f4;
    }

    button {
      margin-right: 8px;
      padding: 6px 12px;
      border: none;
      background-color: #4CAF50;
      color: white;
      cursor: pointer;
      border-radius: 4px;
    }

    button:hover {
      background-color: #45a049;
    }

    .center-form {
      max-width: 900px;
      margin: 50px auto;
      padding: 20px;
    }

    h2 {
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="center-form">
    <h2>Adoption Requests</h2>
    <table id="requests">
      <thead>
        <tr>
          <th>User</th>
          <th>Pet</th>
          <th>Message</th>
          <th>Status</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>

  <script>
    async function loadRequests() {
      const res = await fetch('/api/adoptions');
      const requests = await res.json();
      const tbody = document.querySelector('#requests tbody');
      tbody.innerHTML = '';

      requests.forEach(req => {
        const row = document.createElement('tr');
        row.innerHTML = `
          <td>${req.userId?.name || 'N/A'}<br><small>${req.userId?.email || ''}</small></td>
          <td>${req.petId?.name}<br><small>${req.petId?.species}</small></td>
          <td>${req.message || ''}</td>
          <td>${req.status}</td>
          <td>
            ${req.status === 'pending' ? `
              <button onclick="updateStatus('${req._id}', 'approved')">Approve</button>
              <button onclick="updateStatus('${req._id}', 'rejected')">Reject</button>
            ` : '—'}
          </td>
        `;
        tbody.appendChild(row);
      });
    }

    async function updateStatus(id, status) {
      const res = await fetch(`/api/adoptions/${id}/status`, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ status }),
      });

      const result = await res.json();
      alert(result.message);
      loadRequests();
    }

    loadRequests();
  </script>
</body>
</html>

}

loadRequests();
</script>
