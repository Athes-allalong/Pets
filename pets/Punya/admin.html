<!DOCTYPE html>
<html>
<head>
  <title>Admin - Adoption Requests</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
    }

    .center-form {
      max-width: 800px;
      margin: 40px auto;
    }

    h2 {
      text-align: center;
      margin-bottom: 20px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    th, td {
      padding: 12px 16px;
      text-align: left;
      border-bottom: 1px solid #ddd;
    }

    th {
      background-color: #f5f5f5;
    }

    tr:hover {
      background-color: #f9f9f9;
    }

    button {
      padding: 6px 12px;
      margin-right: 5px;
      border: none;
      background-color: #4CAF50;
      color: white;
      border-radius: 4px;
      cursor: pointer;
    }

    button:last-child {
      background-color: #f44336;
    }

    button:hover {
      opacity: 0.8;
    }
  </style>
</head>
<body>
  <div class="center-form">
    <h2>Adoption Requests</h2>
    <table id="requests">
      <thead>
        <tr>
          <th>User</th>
          <th>Pet</th>
          <th>Message</th>
          <th>Status</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>

  <script>
    async function loadRequests() {
      const res = await fetch('/api/adoptions');
      const requests = await res.json();
      const tbody = document.querySelector('#requests tbody');
      tbody.innerHTML = '';

      requests.forEach(req => {
        const row = document.createElement('tr');
        row.innerHTML = `
          <td>${req.userId?.name || 'N/A'} (${req.userId?.email})</td>
          <td>${req.petId?.name} (${req.petId?.species})</td>
          <td>${req.message || ''}</td>
          <td>${req.status}</td>
          <td>
            ${req.status === 'pending' ? `
              <button onclick="updateStatus('${req._id}', 'approved')">Approve</button>
              <button onclick="updateStatus('${req._id}', 'rejected')">Reject</button>
            ` : ''}
          </td>
        `;
        tbody.appendChild(row);
      });
    }

    async function updateStatus(id, status) {
      const res = await fetch(`/api/adoptions/${id}/status`, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ status }),
      });

      const result = await res.json();
      alert(result.message);
      loadRequests();
    }

    loadRequests();
  </script>
</body>
</html>
