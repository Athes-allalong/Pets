<!DOCTYPE html>
<html>
<head>
  <title>Login</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="center-form">
    <h2>Adoption Requests</h2>
<table id="requests" border="1">
  <thead>
    <tr>
      <th>User</th>
      <th>Pet</th>
      <th>Message</th>
      <th>Status</th>
      <th>Actions</th>
    </tr>
  </thead>

  <tbody></tbody>
</table>
</div>

<script>
async function loadRequests() {
  const res = await fetch('/api/adoptions');
  const requests = await res.json();
  const tbody = document.querySelector('#requests tbody');
  tbody.innerHTML = '';

  requests.forEach(req => {
    const row = document.createElement('tr');
    row.innerHTML = `
      <td>${req.userId?.name || 'N/A'} (${req.userId?.email})</td>
      <td>${req.petId?.name} (${req.petId?.species})</td>
      <td>${req.message || ''}</td>
      <td>${req.status}</td>
      <td>
        ${req.status === 'pending' ? `
          <button onclick="updateStatus('${req._id}', 'approved')">Approve</button>
          <button onclick="updateStatus('${req._id}', 'rejected')">Reject</button>
        ` : ''}
      </td>
    `;
    tbody.appendChild(row);
  });
}

async function updateStatus(id, status) {
  const res = await fetch(`/api/adoptions/${id}/status`, {
    method: 'PUT',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ status }),
  });

  const result = await res.json();
  alert(result.message);
  loadRequests();
}

loadRequests();
</script>
