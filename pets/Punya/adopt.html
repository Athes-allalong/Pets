<!DOCTYPE html>
<html>
<head>
  <title>Login</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="center-form">
   <form id="adoptForm">
  <h2>Request to Adopt a Pet</h2>

  <input name="userId" placeholder="Your User ID" required><br>
  <input name="petId" placeholder="Pet ID" required><br>
  <textarea name="message" placeholder="Why do you want to adopt?"></textarea><br>
  <button type="submit">Submit Request</button>
</form>
</div>

<script>
document.getElementById('adoptForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const formData = new FormData(e.target);
  const data = Object.fromEntries(formData.entries());

  const res = await fetch('/api/adoptions', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(data),
  });

  const result = await res.json();
  alert(result.message);
});
</script>
